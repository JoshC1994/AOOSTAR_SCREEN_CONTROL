<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aoostar Display Studio</title>
    <meta
      name="description"
      content="Local Unraid server telemetry monitor and 960x376 USB LCD screen designer for Aoostar NAS hardware, with Home Assistant integration and Unraid Community Apps Docker deployment."
    />
    <meta property="og:title" content="Aoostar Display Studio" />
    <meta
      property="og:description"
      content="Local Unraid server telemetry monitor and 960x376 USB LCD screen designer for Aoostar NAS hardware."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('aoostar_studio_ui_theme') || 'dark';
          var isDark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-amber-500/30 selection:text-amber-900 dark:selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
